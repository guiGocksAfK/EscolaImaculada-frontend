<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>EscolaImaculada</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      CSP de desenvolvimento (defesa em profundidade contra XSS). Em produção
      quem manda é o header HTTP Content-Security-Policy definido no
      vercel.json: header e <meta> valem ao mesmo tempo e o navegador aplica a
      INTERSEÇÃO das duas, então o header (mais restrito, sem localhost) é o
      que vale no ar. Mexeu na lista de origens aqui? Reveja lá também.

      Só o header consegue usar frame-ancestors (ignorado em <meta>) — é de lá
      que vem a proteção contra clickjacking, junto do X-Frame-Options.

      worker-src/blob: são para a geração de PDF no cliente (jspdf).
      connect-src libera http://localhost:3000 e ws://localhost:* (API local e
      HMR do ng serve) além da API de produção
      (https://escolaimaculada.duckdns.org, o mesmo domínio de
      environment.production.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:3000 ws://localhost:* https://escolaimaculada.duckdns.org; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
